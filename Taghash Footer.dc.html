<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer data-screen-label="Footer" ref="{{ rootRef }}" onMouseMove="{{ onMove }}" onMouseLeave="{{ onLeave }}" style="position:relative; overflow:hidden; border-top:1px solid rgba(255,255,255,.12); background:#050505; color:#FAFAFA; font-family:Archivo, Helvetica, sans-serif; padding:clamp(44px,6vw,90px) clamp(16px,1.6vw,26px) clamp(24px,3vw,40px);">

  <div ref="{{ glowRef }}" style="position:absolute; top:0; left:0; width:520px; height:520px; margin:-260px 0 0 -260px; border-radius:50%; pointer-events:none; background:radial-gradient(circle, rgba(124,43,245,.28), rgba(124,43,245,0) 68%); opacity:0; transition:opacity .4s ease; will-change:transform;"></div>

  <a href="Taghash Contact.dc.html" style="position:relative; display:block; margin-bottom:clamp(34px,5vw,70px);" style-hover="color:#fff;">
    <div ref="{{ bigRef }}" style="display:flex; align-items:baseline; gap:clamp(10px,1.4vw,24px); flex-wrap:wrap; transition:transform .5s cubic-bezier(.22,1,.36,1); will-change:transform;">
      <span style="font-size:clamp(38px,9vw,150px); font-weight:900; letter-spacing:-0.06em; line-height:.86; text-transform:uppercase;">Let's talk</span>
      <span style="display:inline-flex; align-items:center; justify-content:center; width:clamp(40px,4.4vw,74px); height:clamp(40px,4.4vw,74px); border-radius:50%; background:#7C2BF5; font-size:clamp(18px,2vw,30px); box-shadow:0 0 50px -12px rgba(124,43,245,.9);">↗</span>
    </div>
  </a>

  <div style="position:relative; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(180px,45%),1fr)); gap:clamp(24px,3vw,50px); padding-top:clamp(24px,3vw,40px); border-top:1px solid rgba(255,255,255,.1);">
    <sc-for list="{{ columns }}" as="c" hint-placeholder-count="3">
      <div style="display:flex; flex-direction:column; gap:12px;">
        <span style="font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.35); margin-bottom:4px;">{{ c.title }}</span>
        <sc-for list="{{ c.links }}" as="l" hint-placeholder-count="4">
          <a href="{{ l.href }}" style="position:relative; align-self:flex-start; font-size:15px; font-weight:500; letter-spacing:-0.01em; color:rgba(255,255,255,.7); padding-left:0; transition:color .3s ease, padding-left .3s cubic-bezier(.22,1,.36,1);" style-hover="color:#fff; padding-left:16px;">{{ l.label }}</a>
        </sc-for>
      </div>
    </sc-for>
    <div style="display:flex; flex-direction:column; gap:14px;">
      <span style="font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.35);">Newsletter</span>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <input type="email" placeholder="Email" style="flex:1 1 160px; min-width:0; padding:13px 18px; border-radius:999px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.04); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); color:#fff; font-family:Archivo, sans-serif; font-size:14px; outline:none;" />
        <button style="padding:13px 24px; border-radius:999px; cursor:pointer; background:rgba(255,255,255,.05); backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%); border:1px solid rgba(255,255,255,.14); box-shadow:0 0 34px -12px rgba(124,43,245,.8); color:#fff; font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; transition:background .3s ease, border-color .3s ease;" style-hover="background:rgba(124,43,245,.32); border-color:rgba(168,85,247,.55);">Send</button>
      </div>
      <div style="font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.3); line-height:1.9;">{{ clock }} · Bengaluru</div>
    </div>
  </div>

  <div style="position:relative; margin-top:clamp(28px,3.5vw,50px); padding-top:18px; border-top:1px solid rgba(255,255,255,.1); display:flex; flex-wrap:wrap; gap:14px; justify-content:space-between; font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.35);">
    <span>© 2026 Taghash Media</span>
    <span>Privacy · Terms</span>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:460}}">
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { clock: "" };
    this.rootRef = React.createRef();
    this.glowRef = React.createRef();
    this.bigRef = React.createRef();
  }
  componentDidMount() {
    const tick = () => {
      const d = new Date();
      const t = new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit", timeZone: "Asia/Kolkata" }).format(d);
      this.setState({ clock: t + " IST" });
    };
    tick();
    this._t = setInterval(tick, 1000);
  }
  componentWillUnmount() { clearInterval(this._t); }
  renderVals() {
    return {
      rootRef: this.rootRef,
      glowRef: this.glowRef,
      bigRef: this.bigRef,
      clock: this.state.clock,
      onMove: (e) => {
        const root = this.rootRef.current; if (!root) return;
        const r = root.getBoundingClientRect();
        const x = e.clientX - r.left, y = e.clientY - r.top;
        const g = this.glowRef.current;
        if (g) { g.style.opacity = "1"; g.style.transform = "translate3d(" + x + "px," + y + "px,0)"; }
        const b = this.bigRef.current;
        if (b) {
          const dx = (x / r.width - 0.5) * 22, dy = (y / r.height - 0.5) * 12;
          b.style.transform = "translate3d(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px,0)";
        }
      },
      onLeave: () => {
        const g = this.glowRef.current; if (g) g.style.opacity = "0";
        const b = this.bigRef.current; if (b) b.style.transform = "translate3d(0,0,0)";
      },
      columns: [
        { title: "Studio", links: [
          { label: "Work", href: "Taghash Work.dc.html" },
          { label: "Services", href: "Taghash Services.dc.html" },
          { label: "Approach", href: "Taghash Approach.dc.html" },
          { label: "About", href: "Taghash Media Home.dc.html#about" }
        ]},
        { title: "Social", links: [
          { label: "Instagram", href: "Taghash Contact.dc.html" },
          { label: "LinkedIn", href: "Taghash Contact.dc.html" },
          { label: "YouTube", href: "Taghash Contact.dc.html" },
          { label: "Behance", href: "Taghash Contact.dc.html" }
        ]},
        { title: "Say hello", links: [
          { label: "business@taghashmedia.com", href: "mailto:business@taghashmedia.com" },
          { label: "+91 90000 00000", href: "tel:+919000000000" },
          { label: "Bengaluru · Dubai · Toronto", href: "Taghash Contact.dc.html" }
        ]}
      ]
    };
  }
}
</script>
</body>
</html>
