<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin:0; padding:0; background:#050505; }
  * { box-sizing:border-box; }
  a { color:#ffffff; text-decoration:none; }
  a:hover { color:#A855F7; }
  ::selection { background:#7C2BF5; color:#fff; }
  @keyframes tgPulse { 0%,100%{opacity:.35;} 50%{opacity:1;} }
  @keyframes tgRise { from { opacity:0; transform:translate3d(0,30px,0);} to { opacity:1; transform:none;} }
</style>
</helmet>

<div style="background:#050505; color:#FAFAFA; font-family:Archivo, Helvetica, sans-serif;">

  <header data-screen-label="Header" style="position:fixed; top:0; left:0; right:0; z-index:120; display:flex; align-items:flex-start; justify-content:space-between; gap:24px;">
    <div ref="{{ navPillRef }}" style="display:flex; align-items:center; gap:clamp(14px,2vw,34px); background:rgba(17,17,17,.34); backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%); border-right:1px solid rgba(255,255,255,.07); border-bottom:1px solid rgba(255,255,255,.07); box-shadow:0 18px 50px -30px rgba(0,0,0,.9); border-bottom-right-radius:14px; padding:11px clamp(18px,2vw,30px) 11px clamp(16px,1.8vw,26px); transition:background .35s ease, border-color .35s ease;">
      <a href="index.html" style="display:block; flex:none; width:84px; height:34px; overflow:hidden; position:relative;">
        <img src="uploads/photo_2024-08-27_03.04.55-removebg-preview%20(2).png" alt="Taghash Media" style="position:absolute; top:50%; left:50%; width:176px; height:176px; transform:translate(-50%,-46.7%); display:block;" />
      </a>
      <nav style="display:flex; align-items:center; gap:clamp(12px,1.6vw,28px);">
        <a href="#top" style="font-size:15px; font-weight:500; letter-spacing:-0.01em; color:#A855F7;">Work</a>
        <span onMouseEnter="{{ openMenu }}" onMouseLeave="{{ closeMenu }}" style="position:relative; display:inline-flex; align-items:center; gap:7px; cursor:pointer;">
          <a href="services.html" style="font-size:15px; font-weight:500; letter-spacing:-0.01em; color:rgba(255,255,255,.85);" style-hover="color:#A855F7;">Services</a>
          <span style="font-size:9px; line-height:1; opacity:.55; transform:{{ menuArrow }}; transition:transform .3s ease;">▼</span>
          <div style="position:absolute; top:100%; left:-18px; width:min(336px,82vw); padding:22px 10px 10px; border-radius:18px; background:rgba(14,14,14,.72); backdrop-filter:blur(26px) saturate(170%); -webkit-backdrop-filter:blur(26px) saturate(170%); border:1px solid rgba(255,255,255,.12); box-shadow:0 40px 80px -40px rgba(0,0,0,1), 0 0 60px -24px rgba(124,43,245,.5); opacity:{{ menuOpacity }}; visibility:{{ menuVis }}; transform:{{ menuShift }}; transition:opacity .28s ease, transform .32s cubic-bezier(.22,1,.36,1), visibility .28s;">
            <sc-for list="{{ serviceLinks }}" as="l" hint-placeholder-count="6">
              <a href="{{ l.href }}" style="display:flex; align-items:center; gap:12px; padding:12px 15px; border-radius:11px; color:rgba(255,255,255,.78); transition:background .25s ease, color .25s ease;" style-hover="background:rgba(124,43,245,.22); color:#fff;">
                <span style="font-size:14px; font-weight:500; letter-spacing:-0.015em; line-height:1.3;">{{ l.name }}</span>
              </a>
            </sc-for>
          </div>
        </span>
        <a href="approach.html" style="font-size:15px; font-weight:500; letter-spacing:-0.01em; color:rgba(255,255,255,.85);" style-hover="color:#A855F7;">Approach</a>
        <a href="about.html" style="font-size:15px; font-weight:500; letter-spacing:-0.01em; color:rgba(255,255,255,.85);" style-hover="color:#A855F7;">About</a>
        <a href="contact.html" style="font-size:15px; font-weight:500; letter-spacing:-0.01em; color:rgba(255,255,255,.85);" style-hover="color:#A855F7;">Contact</a>
      </nav>
    </div>
    <a href="contact.html" ref="{{ ctaPillRef }}" style="display:flex; align-items:center; gap:10px; background:rgba(17,17,17,.34); backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%); border-left:1px solid rgba(255,255,255,.07); border-bottom:1px solid rgba(255,255,255,.07); box-shadow:0 18px 50px -30px rgba(0,0,0,.9), 0 0 34px -6px rgba(124,43,245,.42), inset 0 0 22px -12px rgba(168,85,247,.6); border-bottom-left-radius:14px; padding:17px clamp(20px,2vw,30px); font-size:15px; font-weight:500; color:rgba(255,255,255,.85); transition:background .35s ease, border-color .35s ease, color .3s ease;" style-hover="color:#fff;">
      Request a Call
      <span style="width:7px; height:7px; border-radius:50%; background:#7C2BF5; animation:tgPulse 2s ease infinite;"></span>
    </a>
  </header>

  <section id="top" data-screen-label="Work hero" onMouseMove="{{ onGlow }}" onMouseLeave="{{ offGlow }}" style="position:relative; overflow:hidden; padding:clamp(120px,18vh,220px) clamp(16px,1.6vw,26px) clamp(28px,4vw,48px);">
    <div data-glow="1" style="position:absolute; top:0; left:0; width:640px; height:640px; margin:-320px 0 0 -320px; border-radius:50%; pointer-events:none; z-index:0; background:radial-gradient(circle, rgba(124,43,245,.30), rgba(124,43,245,0) 68%); opacity:0; transition:opacity .45s ease; will-change:transform;"></div>
    <h1 data-glow-lift="1" style="position:relative; margin:0; font-size:clamp(58px,17vw,290px); font-weight:900; letter-spacing:-0.06em; line-height:.8; text-transform:uppercase; animation:tgRise .8s cubic-bezier(.22,1,.36,1) both;">Work</h1>
    <div style="position:relative; display:flex; flex-wrap:wrap; gap:8px; margin-top:clamp(34px,7vw,120px);">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="6">
        <button onClick="{{ f.select }}" style="padding:12px 24px; border-radius:999px; cursor:pointer; font-family:Archivo, sans-serif; font-size:15px; font-weight:600; letter-spacing:-0.01em; background:{{ f.bg }}; color:{{ f.fg }}; border:1px solid {{ f.bd }}; transition:background .25s ease, color .25s ease, border-color .25s ease;">{{ f.label }}</button>
      </sc-for>
      <button onClick="{{ reset }}" style="display:inline-flex; align-items:center; gap:10px; padding:12px 24px; border-radius:999px; cursor:pointer; font-family:Archivo, sans-serif; font-size:15px; font-weight:600; letter-spacing:-0.01em; background:transparent; color:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.16); transition:color .25s ease, border-color .25s ease;" style-hover="color:#fff; border-color:rgba(168,85,247,.55);">↻ Reset</button>
    </div>
  </section>

  <section data-screen-label="Case grid" style="border-top:1px solid rgba(255,255,255,.12); padding:clamp(34px,5vw,80px) clamp(16px,1.6vw,26px) clamp(60px,8vw,130px);">
    <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(min(max(320px,31%),100%),1fr)); gap:clamp(14px,1.6vw,26px);">
      <sc-for list="{{ cases }}" as="c" hint-placeholder-count="9">
        <a href="#top" style="display:flex; flex-direction:column; gap:14px;" style-hover="color:#fff;">
          <div style="aspect-ratio:4/3; border:1px solid rgba(255,255,255,.1); border-radius:4px; overflow:hidden; background:repeating-linear-gradient(135deg,#0f0f0f 0 14px,#181818 14px 28px); display:flex; align-items:flex-end; padding:16px; transition:border-color .3s ease, transform .45s cubic-bezier(.22,1,.36,1);" style-hover="border-color:rgba(168,85,247,.5); transform:translateY(-4px);">
            <span style="font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.4);">{{ c.slot }}</span>
          </div>
          <div style="display:flex; align-items:baseline; justify-content:space-between; gap:14px;">
            <span style="font-size:clamp(17px,1.5vw,23px); font-weight:800; letter-spacing:-0.03em;">{{ c.client }}</span>
            <span style="font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#A855F7;">{{ c.tag }}</span>
          </div>
          <div style="font-size:14px; line-height:1.5; color:rgba(255,255,255,.5); text-wrap:pretty;">{{ c.result }}</div>
        </a>
      </sc-for>
    </div>
    <div style="margin-top:clamp(26px,3vw,50px); font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.35);">{{ countLabel }}</div>
  </section>

  <section id="contact" data-screen-label="Contact" style="border-top:1px solid rgba(255,255,255,.12); padding:clamp(60px,8vw,130px) clamp(16px,1.6vw,26px);">
    <h2 style="margin:0 0 clamp(24px,3vw,44px); max-width:20ch; font-size:clamp(30px,5.4vw,92px); font-weight:900; letter-spacing:-0.05em; line-height:.96; text-transform:uppercase;">This grid has a gap. <span style="color:#A855F7;">Yours.</span></h2>
    <a href="mailto:business@taghashmedia.com" style="display:inline-flex; align-items:center; gap:12px; padding:18px 34px; border-radius:999px; background:rgba(255,255,255,.05); backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%); border:1px solid rgba(255,255,255,.14); box-shadow:0 24px 60px -34px rgba(0,0,0,.9), 0 0 40px -10px rgba(124,43,245,.4); color:#fff; font-size:16px; font-weight:600; transition:background .3s ease, border-color .3s ease, transform .3s ease;" style-hover="color:#fff; background:rgba(124,43,245,.32); border-color:rgba(168,85,247,.55); transform:translateY(-2px);">Request a call</a>
  </section>

  <dc-import name="Taghash Footer" hint-size="100%,460px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { filter: "All", menu: false };
    this.navPillRef = React.createRef();
    this.ctaPillRef = React.createRef();
  }
  componentDidMount() {
    this._onScroll = () => {
      const g = Math.max(0, Math.min(1, (window.scrollY || 0) / 220));
      [this.navPillRef.current, this.ctaPillRef.current].forEach(el => {
        if (!el) return;
        el.style.background = "rgba(12,12,12," + (0.34 + 0.42 * g) + ")";
        el.style.borderColor = "rgba(255,255,255," + (0.07 + 0.06 * g) + ")";
      });
    };
    window.addEventListener("scroll", this._onScroll, { passive: true });
    this._onScroll();
  }
  componentWillUnmount() { window.removeEventListener("scroll", this._onScroll); }
  renderVals() {
    const all = [
      { client: "Tarzanway", tag: "Performance", result: "312% more booked trips across two seasons.", slot: "case cover / 4:3" },
      { client: "Unbroken Spirit", tag: "Content & PR", result: "41M organic views at launch. Paid budget: zero.", slot: "case cover / 4:3" },
      { client: "Sacred Chants", tag: "Performance", result: "5.8x ROAS across four markets and three languages.", slot: "case cover / 4:3" },
      { client: "The Motoring Club", tag: "Automation", result: "2.4k members onboarded without a single manual email.", slot: "case cover / 4:3" },
      { client: "BullzEye", tag: "Performance", result: "Cost per acquisition down 38% in a quarter.", slot: "case cover / 4:3" },
      { client: "Tarzanway", tag: "UX & web", result: "Booking flow rebuilt around one decision per screen.", slot: "case cover / 4:3" },
      { client: "Sacred Chants", tag: "GEO & SEO", result: "Cited by AI assistants for its category within 90 days.", slot: "case cover / 4:3" },
      { client: "The Motoring Club", tag: "Engineering", result: "Membership platform rebuilt headless, 2.4x faster.", slot: "case cover / 4:3" },
      { client: "BullzEye", tag: "Automation", result: "Ava answers every enquiry in under 15 seconds.", slot: "case cover / 4:3" },
      { client: "Unbroken Spirit", tag: "UX & web", result: "Campaign site shipped in eleven days flat.", slot: "case cover / 4:3" }
    ];
    const tags = ["All", "Performance", "Automation", "GEO & SEO", "Content & PR", "UX & web", "Engineering"];
    const f = this.state.filter;
    const cases = f === "All" ? all : all.filter(c => c.tag === f);
    return {
      onGlow: (e) => {
        const host = e.currentTarget, r = host.getBoundingClientRect();
        const x = e.clientX - r.left, y = e.clientY - r.top;
        const g = host.querySelector("[data-glow]");
        if (g) { g.style.opacity = "1"; g.style.transform = "translate3d(" + x + "px," + y + "px,0)"; }
        const l = host.querySelector("[data-glow-lift]");
        if (l) {
          const dx = (x / r.width - 0.5) * 20, dy = (y / r.height - 0.5) * 12;
          l.style.transition = "transform .55s cubic-bezier(.22,1,.36,1)";
          l.style.transform = "translate3d(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px,0)";
        }
      },
      offGlow: (e) => {
        const host = e.currentTarget;
        const g = host.querySelector("[data-glow]"); if (g) g.style.opacity = "0";
        const l = host.querySelector("[data-glow-lift]"); if (l) l.style.transform = "translate3d(0,0,0)";
      },
      navPillRef: this.navPillRef,
      ctaPillRef: this.ctaPillRef,
      openMenu: () => { clearTimeout(this._mt); this.setState({ menu: true }); },
      closeMenu: () => { clearTimeout(this._mt); this._mt = setTimeout(() => this.setState({ menu: false }), 280); },
      menuOpacity: this.state.menu ? 1 : 0,
      menuVis: this.state.menu ? "visible" : "hidden",
      menuShift: this.state.menu ? "translateY(0)" : "translateY(-10px)",
      menuArrow: this.state.menu ? "rotate(180deg)" : "rotate(0deg)",
      serviceLinks: [["Performance Marketing","performance-marketing"],["Chatbots, Automations & Workflow Builds","automation"],["Generative & Search Optimization","geo-seo"],["AI Content Production & PR","content-pr"],["UX & Website Design","ux-web"],["Engineering & DevOps","engineering"]].map((sv, i) => ({ num: String(i + 1).padStart(2, "0"), name: sv[0], href: "service.html?s=" + sv[1] })),
      cases,
      countLabel: cases.length + " of " + all.length + " projects",
      reset: () => this.setState({ filter: "All" }),
      filters: tags.map(t => ({
        label: t === "All" ? "Show all" : t,
        bg: f === t ? "#FAFAFA" : "rgba(255,255,255,.05)",
        fg: f === t ? "#050505" : "rgba(255,255,255,.7)",
        bd: f === t ? "#FAFAFA" : "rgba(255,255,255,.12)",
        select: () => this.setState({ filter: t })
      }))
    };
  }
}
</script>
</body>
</html>
